version: 2

updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly

- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
  # Digest and patch bumps within the pinned Alpine release are wanted, since
  # that is how package fixes arrive. A release bump is proposed too, but read
  # it before merging: a release carrying a different Dovecot series needs
  # dovecot.conf migrated in the same commit, and the two series reject each
  # other's configuration outright. The build refuses to publish an image whose
  # Dovecot cannot start, so a mistake here fails the pull request rather than
  # the mail server.
