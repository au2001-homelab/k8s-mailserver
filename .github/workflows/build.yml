name: Build Docker image

# Versions are minted here, not by hand: nobody tags a release. Every build of
# the default branch publishes an immutable version naming what is inside it.
on:
  push:
    branches: main
  # Alpine keeps issuing package fixes for a pinned release, and this image sat
  # unrebuilt for two and a half years. A weekly run keeps edge patched and, as
  # it starts what it builds, says whether the tree still produces a working
  # mail server even when nobody has touched it.
  schedule:
  - cron: 0 4 * * 1
  workflow_dispatch:

env:
  CONTAINER_REGISTRY: ghcr.io

# The token may publish packages and read this repository, nothing more.
permissions:
  contents: read
  packages: write

# Two runs finishing out of order could leave a tag pointing at the older
# commit, so let a newer run supersede one still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.CONTAINER_REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ github.token }}

    # Only the moving pointers. The version itself is a property of what apk
    # resolved inside the image, which does not exist yet at this point, so it
    # is minted further down instead.
    - name: Derive image tags
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.CONTAINER_REGISTRY }}/${{ github.repository }}
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,format=long

    # One file at a time: bash -n parses only its first argument and treats the
    # rest as positional parameters, so passing both checked only one of them.
    - name: Check the shell scripts
      run: |
        for script in entrypoint.sh healthcheck.sh; do
          bash -n "${script}"
        done

    # Loaded rather than pushed, so that what gets tested below is the very
    # image that gets published, not a second build of the same source.
    - name: Build image
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    # Read from the image rather than from the Dockerfile: apk resolves package
    # versions at build time, so only the built image knows what it contains.
    - name: Identify the packaged software
      id: packages
      run: |
        set -euo pipefail
        image=$(head -1 <<< "${{ steps.meta.outputs.tags }}")
        docker run --rm --entrypoint apk "${image}" info -v 2>/dev/null \
          | sort > "${RUNNER_TEMP}/packages.txt"

        # apk prints <name>-<version>-r<pkgrel>. The [0-9] anchor is what keeps
        # "dovecot" from matching dovecot-lmtpd and the other subpackages.
        pkgver() {
          local line
          line=$(grep -m1 -E "^$1-[0-9]" "${RUNNER_TEMP}/packages.txt") || {
            echo "::error::$1 is not installed in the image"
            exit 1
          }
          line=${line#"$1"-}
          printf '%s' "${line%-r*}"
        }

        {
          echo "dovecot=$(pkgver dovecot)"
          echo "postfix=$(pkgver postfix)"
          echo "alpine=$(pkgver alpine-release)"
        } >> "${GITHUB_OUTPUT}"

    - name: Start the image and wait for it to report healthy
      run: |
        set -euo pipefail
        image=$(head -1 <<< "${{ steps.meta.outputs.tags }}")

        mkdir -p smoke/tls smoke/dkim/example.test
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -subj /CN=mail.example.test \
          -keyout smoke/tls/server.key -out smoke/tls/server.crt
        openssl genrsa -out smoke/dkim/example.test/default.private 2048

        docker run --detach --name smoke \
          --env MAIL_DOMAINS=example.test \
          --env MAIL_HOST=mail.example.test \
          --env USERNAME=smoke \
          --env PASSWORD=smoke-password \
          --volume "${PWD}/smoke/tls:/tls:ro" \
          --volume "${PWD}/smoke/dkim:/etc/opendkim/keys:ro" \
          "${image}"

        for _ in $(seq 60); do
          if docker exec smoke /healthcheck.sh; then
            exit 0
          fi
          sleep 2
        done

        echo "the image never became healthy"
        docker logs smoke
        exit 1

    # The mailbox password used to have a built-in default, so a deployment
    # that forgot to set one silently published a guessable account.
    # Bounded, because a regression here means the container starts and runs a
    # mail server in the foreground: without the timeout the step would hang
    # until the job hit its own limit hours later instead of failing.
    - name: Check that incomplete configuration is refused
      run: |
        if timeout 60 docker run --rm --env MAIL_DOMAINS=example.test \
             --env USERNAME=smoke \
             $(head -1 <<< "${{ steps.meta.outputs.tags }}"); then
          echo "the image started without a password"
          exit 1
        fi

    # The version names what the image contains and when it was built, so it can
    # be minted without anyone deciding anything. It is applied to the image
    # that was just tested with docker tag rather than a second build, so what
    # is published is the very thing the smoke test approved.
    #
    # Default branch only: a manual run from a side branch would otherwise mint
    # a version outranking every build on main and deploy unmerged work.
    - name: Derive the version from the packaged software
      id: version
      if: github.ref == 'refs/heads/main'
      env:
        REPOSITORY: ${{ env.CONTAINER_REGISTRY }}/${{ github.repository }}
        DOVECOT: ${{ steps.packages.outputs.dovecot }}
        POSTFIX: ${{ steps.packages.outputs.postfix }}
        ALPINE: ${{ steps.packages.outputs.alpine }}
      run: |
        set -euo pipefail
        image=$(head -1 <<< "${{ steps.meta.outputs.tags }}")

        # What actually went into this image: the tree, the resolved packages
        # and the suffix list fetched during the build. Anything else fetched at
        # build time in future belongs here too, or a rebuild that mattered
        # would be mistaken for a repeat of the one before it.
        psl=$(docker run --rm --entrypoint sha256sum "${image}" \
                /etc/opendmarc/public_suffix_list.dat)
        fingerprint=fp-$(printf '%s\n%s\n%s\n' \
          "$(git rev-parse 'HEAD^{tree}')" \
          "$(cat "${RUNNER_TEMP}/packages.txt")" \
          "${psl}" | sha256sum | cut -c1-12)

        known=false
        if docker buildx imagetools inspect "${REPOSITORY}:${fingerprint}" > /dev/null 2>&1; then
          known=true
        fi

        # Only the weekly rebuild is skipped this way. Skipping a push would
        # mean a commit reverting the tree to an earlier state published
        # nothing, leaving the cluster on the image being reverted away from.
        if [ "${known}" = true ] && [ "${GITHUB_EVENT_NAME}" = schedule ]; then
          echo "::notice title=No new version::Byte for byte the mail server already published as ${fingerprint}. The moving tags follow this build; no version is published and no deployment pull request opens."
          exit 0
        fi

        # Seconds rather than minutes: Flux keys its filtered tags by the
        # extracted ordering value, and two tags sharing one silently shadow
        # each other.
        tag="dovecot${DOVECOT}-postfix${POSTFIX}-alpine${ALPINE}-b$(date --utc +%Y%m%d%H%M%S)"

        # A republished version stops naming one fixed image, and every
        # rollback target that names it stops being reproducible.
        if docker buildx imagetools inspect "${REPOSITORY}:${tag}" > /dev/null 2>&1; then
          echo "::error title=Version already published::${tag} exists; refusing to overwrite it."
          exit 1
        fi

        docker tag "${image}" "${REPOSITORY}:${tag}"
        published="${REPOSITORY}:${tag}"
        if [ "${known}" != true ]; then
          docker tag "${image}" "${REPOSITORY}:${fingerprint}"
          published=$(printf '%s\n%s' "${published}" "${REPOSITORY}:${fingerprint}")
        fi

        {
          echo 'tags<<TAGS_EOF'
          echo "${published}"
          echo 'TAGS_EOF'
        } >> "${GITHUB_OUTPUT}"

        {
          echo "### \`${tag}\`"
          echo
          echo "Ordering key \`${tag##*-b}\`, content \`${fingerprint}\`"
          echo
          echo '<details><summary>installed packages</summary>'
          echo
          echo '```'
          cat "${RUNNER_TEMP}/packages.txt"
          echo '```'
          echo
          echo '</details>'
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Push image
      env:
        TAGS: |
          ${{ steps.meta.outputs.tags }}
          ${{ steps.version.outputs.tags }}
      # Unquoted on purpose: the tag lists arrive as multi-line values whose
      # continuation lines carry whatever indentation YAML gave them, and word
      # splitting discards that along with the blank lines. Tags never contain
      # whitespace, so there is nothing to preserve.
      run: |
        set -euo pipefail
        for tag in ${TAGS}; do
          docker push "${tag}"
        done
