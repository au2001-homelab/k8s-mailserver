name: Build Docker image

# Releases are cut by pushing a tag such as v1.2.3. Pushes to main rebuild the
# edge tag only, so that landing a commit never moves the tag a running mail
# server is pulling: promoting a build is a deliberate act.
on:
  push:
    branches: main
    tags: v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:

env:
  CONTAINER_REGISTRY: ghcr.io

# The token may publish packages and read this repository, nothing more.
permissions:
  contents: read
  packages: write

# Two runs finishing out of order could leave a tag pointing at the older
# commit, so let a newer run supersede one still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.CONTAINER_REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ github.token }}

    # A release tag publishes the full version, the minor and the major series,
    # so a deployment can pin as tightly as it wants and still receive patches.
    # latest follows releases only, never main.
    - name: Derive image tags
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.CONTAINER_REGISTRY }}/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=sha,format=long

    - name: Check the shell scripts
      run: bash -n entrypoint.sh healthcheck.sh

    # Loaded rather than pushed, so that what gets tested below is the very
    # image that gets published, not a second build of the same source.
    - name: Build image
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Start the image and wait for it to report healthy
      run: |
        set -euo pipefail
        image=$(head -1 <<< "${{ steps.meta.outputs.tags }}")

        mkdir -p smoke/tls smoke/dkim/example.test
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -subj /CN=mail.example.test \
          -keyout smoke/tls/server.key -out smoke/tls/server.crt
        openssl genrsa -out smoke/dkim/example.test/default.private 2048

        docker run --detach --name smoke \
          --env MAIL_DOMAINS=example.test \
          --env MAIL_HOST=mail.example.test \
          --env USERNAME=smoke \
          --env PASSWORD=smoke-password \
          --volume "${PWD}/smoke/tls:/tls:ro" \
          --volume "${PWD}/smoke/dkim:/etc/opendkim/keys:ro" \
          "${image}"

        for _ in $(seq 60); do
          if docker exec smoke /healthcheck.sh; then
            exit 0
          fi
          sleep 2
        done

        echo "the image never became healthy"
        docker logs smoke
        exit 1

    # The mailbox password used to have a built-in default, so a deployment
    # that forgot to set one silently published a guessable account.
    - name: Check that incomplete configuration is refused
      run: |
        if docker run --rm --env MAIL_DOMAINS=example.test --env USERNAME=smoke \
             $(head -1 <<< "${{ steps.meta.outputs.tags }}"); then
          echo "the image started without a password"
          exit 1
        fi

    - name: Push image
      run: |
        set -euo pipefail
        while read -r tag; do
          [ -n "${tag}" ] && docker push "${tag}"
        done <<< "${{ steps.meta.outputs.tags }}"
