name: Build Docker image

# Releases are cut by pushing a tag such as v1.2.3. Pushes to main rebuild the
# edge tag only, so that landing a commit never moves the tag a running mail
# server is pulling: promoting a build is a deliberate act.
on:
  push:
    branches: main
    tags: v[0-9]+.[0-9]+.[0-9]+
  workflow_dispatch:

env:
  CONTAINER_REGISTRY: ghcr.io

# The token may publish packages and read this repository, nothing more.
permissions:
  contents: read
  packages: write

# Two runs finishing out of order could leave a tag pointing at the older
# commit, so let a newer run supersede one still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.CONTAINER_REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ github.token }}

    # A release tag publishes the full version, the minor and the major series,
    # so a deployment can pin as tightly as it wants and still receive patches.
    # latest follows releases only, never main.
    - name: Derive image tags
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.CONTAINER_REGISTRY }}/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=sha,format=long

    - name: Build and push image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
