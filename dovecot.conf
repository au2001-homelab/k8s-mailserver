protocols                = imap lmtp
listen                   = *
haproxy_trusted_networks = 10.0.0.0/8

mail_home         = /var/spool/mail/vhosts/%d/%n
mail_location     = maildir:~/mail
valid_chroot_dirs = /var/spool/mail
first_valid_uid   = 0
first_valid_gid   = 0
mail_uid          = postmaster
mail_gid          = root

log_path             = /dev/stdout

auth_mechanisms = plain login

passdb {
  driver         = passwd-file
  args           = /etc/dovecot/passwd
  default_fields = home=/var/spool/mail/vhosts/%d/%n
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    user  = postfix
    group = root
    mode  = 0660
  }
}

service lmtp {
 unix_listener /var/spool/postfix/private/dovecot-lmtp {
   user  = postfix
   group = root
   mode  = 0660
  }
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

service imap-login {
  inet_listener imap {
    port    = 143
    haproxy = yes
  }
  # inet_listener imaps {
  #   port    = 993
  #   ssl     = yes
  #   haproxy = yes
  # }
}

plugin {
  sieve_before = /var/lib/dovecot/sieve/before.d/
  sieve_after = /var/lib/dovecot/sieve/after.d/
}

# TLS settings, written by the entrypoint.
!include_try local.conf
