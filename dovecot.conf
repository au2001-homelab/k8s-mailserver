protocols                = imap lmtp
listen                   = *
haproxy_trusted_networks = 10.0.0.0/8

mail_home         = /var/spool/mail/vhosts/%d/%n
mail_location     = maildir:~/mail
valid_chroot_dirs = /var/spool/mail
# Mail is owned by postmaster, uid 14, which is below the default floor of 500.
# The floor is lowered to exactly that uid rather than to zero, so no other
# system account can be used to reach the mail store. The group floor has to
# stay at zero because mail_gid is root.
first_valid_uid   = 14
first_valid_gid   = 0
mail_uid          = postmaster
mail_gid          = root

log_path             = /dev/stdout

auth_mechanisms = plain login

passdb {
  driver         = passwd-file
  args           = /etc/dovecot/passwd
  default_fields = home=/var/spool/mail/vhosts/%d/%n
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    user  = postfix
    group = root
    mode  = 0660
  }
}

service lmtp {
 unix_listener /var/spool/postfix/private/dovecot-lmtp {
   user  = postfix
   group = root
   mode  = 0660
  }
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

# The sieve rule creates Spam on first use, but an unsubscribed mailbox is
# hidden by most mail clients, so without this the quarantined mail is filed
# somewhere the recipient never looks.
lda_mailbox_autosubscribe = yes

service imap-login {
  inet_listener imap {
    port    = 143
    haproxy = yes
  }
  inet_listener imaps {
    port    = 993
    ssl     = yes
    haproxy = yes
  }
}

plugin {
  sieve_before = /var/lib/dovecot/sieve/before.d/
  sieve_after = /var/lib/dovecot/sieve/after.d/
}

# TLS settings, written by the entrypoint.
!include_try local.conf
