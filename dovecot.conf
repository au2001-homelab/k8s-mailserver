# Both versions name the 2.4 series rather than the exact release installed.
# Packages are resolved at build time, so a rebuild can move Dovecot to a later
# 2.4.x on its own; declaring the baseline means such a bump cannot quietly
# change configuration defaults or on-disk formats underneath a running server.
dovecot_config_version  = 2.4.0
dovecot_storage_version = 2.4.0

protocols                = imap lmtp
listen                   = *
haproxy_trusted_networks = 10.0.0.0/8

mail_home   = /var/spool/mail/vhosts/%{user | domain}/%{user | username}
mail_driver = maildir
mail_path   = ~/mail
# Mail is owned by postmaster, uid 14, which is below the default floor of 500.
# The floor is lowered to exactly that uid rather than to zero, so no other
# system account can be used to reach the mail store. The group floor has to
# stay at zero because mail_gid is root.
first_valid_uid = 14
first_valid_gid = 0
mail_uid        = postmaster
mail_gid        = root

log_path = /dev/stdout

auth_mechanisms = plain login

passdb passwd-file {
  passwd_file_path = /etc/dovecot/passwd
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    user  = postfix
    group = root
    mode  = 0660
  }
}

service lmtp {
 unix_listener /var/spool/postfix/private/dovecot-lmtp {
   user  = postfix
   group = root
   mode  = 0660
  }
}

protocol lmtp {
  # Named outright rather than appended to $mail_plugins: 2.4 does not expand
  # that variable here and takes it for a plugin name, which makes every
  # delivery fail with "Plugin '$mail_plugins' not found".
  mail_plugins = sieve
}

# The sieve rule creates Spam on first use, but an unsubscribed mailbox is
# hidden by most mail clients, so without this the quarantined mail is filed
# somewhere the recipient never looks.
lda_mailbox_autosubscribe = yes

service imap-login {
  inet_listener imap {
    port    = 143
    haproxy = yes
  }
  inet_listener imaps {
    port    = 993
    ssl     = yes
    haproxy = yes
  }
}

sieve_script before {
  type = before
  path = /var/lib/dovecot/sieve/before.d/
}

sieve_script after {
  type = after
  path = /var/lib/dovecot/sieve/after.d/
}

# TLS settings, written by the entrypoint.
!include_try local.conf
