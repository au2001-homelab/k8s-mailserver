worker "rspamd_proxy" {
    milter  = yes;
    timeout = 120s;

    upstream "local" {
      default   = yes;
      self_scan = yes;
    }

    bind_socket = "localhost:11333";

    milter  = yes;
    timeout = 120s;

    upstream "local" {
      default   = yes;
      self_scan = yes;
    }

    count                = 1;
    max_retries          = 5;
    discard_on_reject    = false;
    quarantine_on_reject = false;
    spam_header          = "X-Spam";
    reject_message       = "Spam message rejected";
}
