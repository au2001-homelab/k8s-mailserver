[supervisord]
nodaemon         = true
user             = root
logfile          = /dev/null
logfile_maxbytes = 0

[program:postfix]
command                 = postfix -c /etc/postfix start-fg
stdout_logfile          = /dev/stdout
stderr_logfile          = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:maillog2stdout]
command                 = tail -f -n 0 /var/log/mail.log
stdout_logfile          = /dev/stdout
stderr_logfile          = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
