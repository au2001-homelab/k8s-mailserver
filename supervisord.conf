[supervisord]
nodaemon = true
user     = root

[program:postfix]
command                 = /postfix.sh
stdout_logfile          = /dev/stdout
stderr_logfile          = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:maillog2stdout]
command                 = tail -f -n +1 /var/log/mail.log
stdout_logfile          = /dev/stdout
stderr_logfile          = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
