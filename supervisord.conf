[supervisord]
nodaemon         = true
user             = root
logfile          = /dev/null
logfile_maxbytes = 0

# Needed for supervisorctl, which the health check uses to notice a process
# that has died or given up restarting while the container still looks alive.
[unix_http_server]
file = /run/supervisord.sock

[supervisorctl]
serverurl = unix:///run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Priority decides both directions: logging comes up first and goes down last,
# so shutdown stays visible, and Postfix stops first so nothing new is accepted
# while delivery is still draining. The stop timeouts add up to well under the
# grace period Kubernetes allows before it resorts to SIGKILL.

[program:syslog-ng]
command                 = syslog-ng -F
priority                = 1
autorestart             = true
stopwaitsecs            = 2
stdout_logfile          = /dev/stdout
stderr_logfile          = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:opendkim]
command                 = opendkim -f
priority                = 10
autorestart             = true
stopwaitsecs            = 4
stdout_logfile          = /dev/stdout
stderr_logfile          = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:opendmarc]
command                 = /usr/sbin/opendmarc -c /etc/opendmarc.conf -f
priority                = 10
autorestart             = true
stopwaitsecs            = 4
stdout_logfile          = /dev/stdout
stderr_logfile          = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:dovecot]
command                 = dovecot -F
priority                = 20
autorestart             = true
stopwaitsecs            = 8
stdout_logfile          = /dev/stdout
stderr_logfile          = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:tls-reload]
command                 = /tls-reload.sh
priority                = 40
autorestart             = true
stopwaitsecs            = 2
stdout_logfile          = /dev/stdout
stderr_logfile          = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0

[program:postfix]
command                 = postfix start-fg
priority                = 30
autorestart             = true
stopwaitsecs            = 10
stdout_logfile          = /dev/stdout
stderr_logfile          = /dev/stderr
stdout_logfile_maxbytes = 0
stderr_logfile_maxbytes = 0
